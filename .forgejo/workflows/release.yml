# Codeberg / Forgejo Actions — on a `v*` tag push, build the Python package (the
# hatch build hook cross-compiles all six Go binaries) and publish it: to the
# repo's built-in PyPI registry (for `pip install`) and as a Codeberg Release.
#
# Runs on Codeberg's HOSTED runners — no self-hosted instance needed: unlike the
# Docker-image build, this needs only Go + Python (no Docker daemon). The hosted
# runners are `codeberg-tiny|small|medium` (1/2/4 CPU, 2/4/8 GB, 2/5/10-min caps);
# this uses `codeberg-small` — the cold six-target cross-compile measures ~20s on
# 2 cores, so with setup-go + uv + publish the job lands well inside small's 5-min
# cap (tiny's 2 min is too tight for the fixed setup overhead). (The Docker image is
# a separate, deferred pipeline.)
#
# Setup required on the Codeberg repo (Settings → Actions):
#   * The repo must be PUBLIC — Codeberg's hosted runners only serve public,
#     free/libre-licensed projects (AGPL qualifies). A private repo's job stays
#     queued as "no matching online runner". (Alternative: self-host a runner and
#     set runs-on to its label.)
#   * Enable "integrated CI/CD pipelines" (Forgejo Actions).
#   * Secret PACKAGE_TOKEN: a Forgejo access token with `write:package` scope
#     (used to upload to the PyPI registry). The automatic token handles the
#     release itself.

name: release
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      # Verify the tag matches the packaged library version (drop `.dev0` before
      # tagging — the same gate the Docker pipeline applies to APP_VERSION).
      - name: Verify tag == library __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -E '^__version__' residualrisk/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "$ver" = "$tag" ] || { echo "::error::__version__ '$ver' != tag '$tag'"; exit 1; }

      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build wheel + sdist (cross-compiles all six Go targets)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Publish to the Codeberg PyPI registry
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv publish \
            --publish-url "https://codeberg.org/api/packages/${{ github.repository_owner }}/pypi" \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.PACKAGE_TOKEN }}" \
            dist/*

      # A stable tag is exactly vX.Y.Z; anything else (aN/bN/rcN/.devN — PEP 440
      # pre/dev releases) is flagged as a pre-release so it isn't shown as "Stable"
      # on the Releases page or mistaken for the current stable build.
      - name: Classify the tag (stable vs pre-release)
        id: release_type
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if printf '%s' "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            pre=false
          else
            pre=true
          fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "::notice::tag ${GITHUB_REF_NAME} → prerelease=$pre"

      - name: Create the Codeberg release with the artifacts attached
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: dist
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
