[project]
name = "residualrisk"
dynamic = ["version"]
description =  "Residual risk estimation tool"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "streamlit>=1.58.0",
    "polars>=1.41.2",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "plotly>=6.7.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "residualrisk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["residualrisk"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ipykernel>=7.2.0",
    "matplotlib>=3.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "multiprocessing: test exercises the Python ProcessPoolExecutor bootstrap path. These fail in sandboxed environments that disallow semaphore creation. Exclude with -m 'not multiprocessing' (see scripts/run_tests.sh fast).",
]
