[project]
name = "residualrisk"
dynamic = ["version"]
description =  "Residual risk estimation tool"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "streamlit>=1.58.0",
    "polars>=1.42.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "plotly>=6.7.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "residualrisk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["residualrisk"]

# Cross-compile the Go accelerator for every target and bundle the binaries into
# the wheel (see hatch_build.py). Needs the Go toolchain at build time only.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Lean sdist: only what's needed to rebuild the wheel from source (the fat wheel is
# py3-none-any, so the sdist is rarely fetched). Drops the app data that the wheel
# never ships anyway — static/ (~8 MB posteriors + logos), docs/, app.py/estimator.py/
# pages/ — and tests. `residualrisk/` gives the library + version; `go/` the source
# the build hook cross-compiles.
[tool.hatch.build.targets.sdist]
include = [
    "/residualrisk",
    "/go",
    "/pyproject.toml",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ipykernel>=7.2.0",
    "matplotlib>=3.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "multiprocessing: test exercises the Python ProcessPoolExecutor bootstrap path. These fail in sandboxed environments that disallow semaphore creation. Exclude with -m 'not multiprocessing' (see scripts/run_tests.sh fast).",
]
