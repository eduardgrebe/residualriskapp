# Copyright (C) 2025  Vitalant and Eduard Grebe Consulting
# Author: Eduard Grebe <egrebe@vitalant.org> <eduard@grebe.consulting>
#
# Builds and publishes multi-architecture Docker images to ghcr.io on version
# tags (v*) only. Versions follow PEP 440. A stable release tag (v1.2.3) produces
# images tagged 1.2.3, 1.2, and latest. A pre-release tag (e.g. v1.1.0a1)
# produces only the full version tag (1.1.0a1) — no major.minor and no latest —
# so it can never move the production latest / 1.x tags. Pre-release and stable
# images coexist in the same ghcr.io/<owner>/residualrisk package.

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/residualrisk
          # PEP 440 versions. latest=auto applies `latest` to stable releases
          # only; for pre-releases (e.g. 1.1.0a1) the latest and major.minor /
          # major tags are excluded, so a pre-release publishes only its full
          # version tag and never moves the production `latest`/`1.x` tags.
          flavor: |
            latest=auto
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
